# Run the game in Docker:  docker compose up --build
# Settings come from .env (copy .env.example first). Scores persist in ./data.
services:
  vault-heist:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      VAULT_HOST: 0.0.0.0
      VAULT_OPEN_BROWSER: "false"
      # Reach Ollama running on the host machine
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./extensions:/app/extensions
    extra_hosts:
      - "host.docker.internal:host-gateway"
