[project]
name = "vault-heist"
version = "0.1.0"
description = "A hands-on CTF-style workshop for AI guardrails, authorization, and observability."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "langgraph>=0.2",
    "anthropic>=0.70",
]

[project.optional-dependencies]
# Optional integrations. Install with: uv sync --extra langfuse (or nemo, crew, all)
langfuse = ["langfuse>=3.0"]
nemo = ["nemoguardrails>=0.11"]
crew = ["crewai>=0.100"]
all = ["vault-heist[langfuse,nemo,crew]"]

[project.scripts]
vault-heist = "vault_heist.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vault_heist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
